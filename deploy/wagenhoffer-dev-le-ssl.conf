<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName wagenhoffer.dev
    ServerAlias www.wagenhoffer.dev

    DocumentRoot /var/www/wagenhoffer-dev

    <Directory /var/www/wagenhoffer-dev>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/wagenhoffer_error.log
    CustomLog ${APACHE_LOG_DIR}/wagenhoffer_access.log combined
    LogFormat "%a - %u [%{%Y-%m-%dT%H:%M:%S%z}t] \"%m %U\" %>s %b rt=%D host=\"%{Host}i\" ref=\"%{Referer}i\" ua=\"%{User-Agent}i\"" honeypot
    SetEnvIf Request_URI "^/login/submit$" is_login_submit=1
    CustomLog ${APACHE_LOG_DIR}/login_honeypot.log honeypot env=is_login_submit

    RewriteEngine on
    RewriteRule ^/login$ /login/ [R=301,L]
    RewriteRule ^/login/submit$ /login/submit.php [L]
    RewriteRule ^/login/submit\.php$ - [R=404,L]

    <LocationMatch "^/login(?:/|$)">
        Header always set X-Robots-Tag "noindex, nofollow, noarchive, nosnippet"
        Header always set Cache-Control "no-store"
    </LocationMatch>

    # FreeStar 4000 weather stream - HLS from mediamtx (127.0.0.1:8888)
    # Player page is static at /var/www/wagenhoffer-dev/weather/
    ProxyPass /weather/hls/ http://127.0.0.1:8888/weather/hls/
    ProxyPassReverse /weather/hls/ http://127.0.0.1:8888/weather/hls/

    # The Asphalt Trail - browser client and ASP.NET game host. The socket proxy
    # starts the app on demand and lets it stop after 30 minutes without traffic.
    RewriteRule ^/oregon$ /oregon/ [R=301,L]
    RewriteRule ^/Oregon/?$ /oregon/ [R=301,L]
    ProxyPass /oregon/ http://127.0.0.1:7681/ timeout=60
    ProxyPassReverse /oregon/ http://127.0.0.1:7681/
    <Location /oregon/>
        RequestHeader set X-Forwarded-Proto "https"
    </Location>
    <Location /oregon/api/game/events>
        SetEnv no-gzip 1
    </Location>

Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/wagenhoffer.dev/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/wagenhoffer.dev/privkey.pem
</VirtualHost>
</IfModule>
